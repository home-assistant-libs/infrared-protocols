[build-system]
requires = ["setuptools>=78.1.1,<83.0"]
build-backend = "setuptools.build_meta"

[project]
name         = "infrared-protocols"
# Placeholder; the publish workflow injects the release tag as the version.
version      = "0.0.0"
license      = "MIT"
description  = "Library to decode and encode infrared signals."
readme       = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/home-assistant-libs/infrared-protocols"

[dependency-groups]
dev = [
    "prek>=0.5.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["infrared_protocols*"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # pydocstyle
    "D",
    # flake8-annotations
    "ANN",
    # isort
    "I",]
ignore = [
    # Prefer no blank line before class docstrings.
    "D203",
    # Prefer multi-line docstring summaries on the first line.
    "D213",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest]
addopts = [
    "-v",
    "--tb=short",
]
minversion = "9.0"
pythonpath = ["."]
testpaths = ["tests"]